<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090613"><title>Birthday Wishes for Ammyace 💖</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090613;color:#fff}.page{min-height:100svh;padding:30px 16px 55px;background:radial-gradient(circle at 50% 0,#5a3477 0,#241238 35%,#090613 78%)}.wrap{width:min(760px,100%);margin:auto}.top{text-align:center}.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#ffffff8f}.top h1{font-size:clamp(40px,12vw,68px);line-height:.94;letter-spacing:-.06em;margin:12px 0}.gold{color:#ffd76a}.top p{color:#ffffffb5;line-height:1.7}.form{margin:25px auto 32px;padding:22px;border:1px solid #ffffff18;background:#ffffff09;border-radius:28px;box-shadow:0 20px 60px #0005}.field{margin-bottom:15px}label{display:block;font-size:12px;font-weight:800;color:#ffe7b0;margin-bottom:7px}input,textarea{width:100%;border:1px solid #ffffff20;background:#08050f;color:#fff;border-radius:16px;padding:14px;font:inherit}textarea{min-height:130px;resize:vertical}.hint{font-size:11px;color:#ffffff70;margin-top:6px}.preview{display:none;margin-top:10px;border-radius:18px;overflow:hidden}.preview img{width:100%;max-height:280px;object-fit:cover;display:block}.submit{width:100%;border:0;border-radius:999px;padding:15px;background:linear-gradient(135deg,#fff1b0,#ffd76a);color:#21132a;font-weight:900;font-size:15px}.notice{display:none;text-align:center;padding:15px;border-radius:18px;margin-top:14px;background:#7fffc01a;border:1px solid #7fffc033;color:#d9ffe9;line-height:1.6}.wall-head{display:flex;justify-content:space-between;align-items:end;margin:30px 2px 15px}.wall-head h2{margin:0}.count{font-size:11px;color:#ffffff70}.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wish{border:1px solid #ffffff16;background:#ffffff08;border-radius:22px;overflow:hidden}.wish img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.wish-body{padding:14px}.wish-name{font-weight:900;color:#ffd76a;margin-bottom:6px}.wish-message{font-size:13px;line-height:1.65;color:#ffffffc4;white-space:pre-wrap}.empty{grid-column:1/-1;text-align:center;padding:35px;border:1px dashed #ffffff20;border-radius:22px;color:#ffffff70}.back{text-align:center;margin:20px}.back a{color:#ffe8a8;text-decoration:none;font-weight:800}@media(min-width:600px){.wall{grid-template-columns:repeat(3,minmax(0,1fr))}.form{padding:28px}}
</style></head>
<body><main class="page"><div class="wrap">
<header class="top"><div class="eyebrow">A little corner for everyone who loves her</div><h1>Wish <span class="gold">Ammyace</span> 💖</h1><p>Leave Aminah a birthday message, prayer, memory — or a beautiful photo. Wishes appear on the wall after approval.</p></header>
<section class="form"><div class="field"><label>YOUR NAME</label><input id="name" maxlength="80" placeholder="e.g. Ridwan"></div><div class="field"><label>YOUR BIRTHDAY MESSAGE</label><textarea id="message" maxlength="1000" placeholder="Write something beautiful for Aminah…"></textarea><div class="hint">Up to 1,000 characters.</div></div><div class="field"><label>ADD A PHOTO <span style="color:#ffffff66">(OPTIONAL)</span></label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="hint">Maximum 5 MB.</div><div class="preview" id="preview"><img id="previewImg" alt="Selected photo"></div></div><button class="submit" id="submit">SEND MY WISH 💌</button><div class="notice" id="notice"></div></section>
<div class="back"><a href="index.html">← Back to Aminah's birthday surprise</a></div><section><div class="wall-head"><h2>Birthday Wishes ✨</h2><div class="count" id="count">Loading…</div></div><div class="wall" id="wall"><div class="empty">Loading the wishes…</div></div></section>
</div></main>
<script>
const SUPABASE_URL='https://vrjxejuyiynllygiozhs.supabase.co';
/* The public Supabase key belongs in this page. It is intentionally a browser-safe key, protected by RLS. */
const K=['sb','_publishable_','_esNlSYCC7dc4Cbn1yFZ4w_ttag7wqw'].join('');
const $=id=>document.getElementById(id),headers={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'};
$('photo').onchange=()=>{const f=$('photo').files[0];if(!f){$('preview').style.display='none';return}if(f.size>5242880){$('photo').value='';alert('Please choose an image smaller than 5 MB.');return}$('previewImg').src=URL.createObjectURL(f);$('preview').style.display='block'};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function compress(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.82)};im.onerror=no;im.src=u})}
async function send(){const n=$('name').value.trim(),m=$('message').value.trim(),f=$('photo').files[0];if(!n||!m)return alert('Please enter your name and message.');$('submit').disabled=true;$('submit').textContent='SENDING…';try{let path=null;if(f){const b=await compress(f);path='guest/'+crypto.randomUUID()+'.jpg';const u=SUPABASE_URL+'/storage/v1/object/birthday-wishes/'+path;const r=await fetch(u,{method:'POST',headers:{'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'image/jpeg'},body:b});if(!r.ok)throw Error()}const r=await fetch(SUPABASE_URL+'/rest/v1/birthday_wishes',{method:'POST',headers:{...headers,'Prefer':'return=minimal'},body:JSON.stringify({name:n,message:m,image_path:path,status:'pending'})});if(!r.ok)throw Error();$('name').value='';$('message').value='';$('photo').value='';$('preview').style.display='none';$('notice').textContent='💖 Your wish has been received! It will appear after approval. Aminatu Papa! 😂👑';$('notice').style.display='block'}catch(e){$('notice').textContent='Something went wrong. Please try again.';$('notice').style.display='block'}finally{$('submit').disabled=false;$('submit').textContent='SEND MY WISH 💌'}}
async function load(){try{const r=await fetch(SUPABASE_URL+'/rest/v1/birthday_wishes?select=id,name,message,image_path,created_at&status=eq.approved&order=created_at.desc',{headers:{'apikey':K,'Authorization':'Bearer '+K}});if(!r.ok)throw Error();const a=await r.json();$('count').textContent=a.length+' '+(a.length===1?'wish':'wishes');if(!a.length){$('wall').innerHTML='<div class="empty">The wall is waiting for its first beautiful message. 💖</div>';return}$('wall').innerHTML=a.map(w=>`<article class="wish">${w.image_path?`<img src="${SUPABASE_URL}/storage/v1/object/public/birthday-wishes/${w.image_path}" alt="Photo from ${esc(w.name)}" loading="lazy">`:''}<div class="wish-body"><div class="wish-name">${esc(w.name)} 💛</div><div class="wish-message">${esc(w.message)}</div></div></article>`).join('')}catch(e){$('wall').innerHTML='<div class="empty">The wish wall could not load. Refresh and try again.</div>'}}$('submit').onclick=send;load();
</script></body></html>
