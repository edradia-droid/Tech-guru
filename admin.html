<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090613"><title>Ammyace Wishes — Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#090613;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.page{min-height:100svh;padding:28px 16px 60px;background:radial-gradient(circle at 50% 0,#5a3477,#090613 70%)}.wrap{width:min(900px,100%);margin:auto}.head{text-align:center}.eyebrow{font-size:10px;letter-spacing:.25em;color:#ffffff88;text-transform:uppercase}.head h1{font-size:clamp(34px,10vw,58px);margin:10px 0}.gold{color:#ffd76a}.panel{margin-top:22px;padding:20px;border:1px solid #ffffff18;background:#ffffff09;border-radius:24px}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff20;background:#08050f;color:#fff;font:inherit;margin:8px 0 12px}.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:#ffd76a;color:#21132a}.primary:disabled{opacity:.6;cursor:wait}.muted{color:#ffffff80;font-size:13px;line-height:1.6}.hidden{display:none}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{background:#ffffff10;color:#fff;border:1px solid #ffffff18}.tab.active{background:#ffd76a;color:#21132a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#ffffff09;border:1px solid #ffffff16;border-radius:20px;overflow:hidden}.card img{width:100%;max-height:280px;object-fit:cover;display:block}.body{padding:16px}.name{font-weight:900;color:#ffd76a}.msg{white-space:pre-wrap;line-height:1.6;color:#ffffffc8;margin:9px 0 14px}.date{font-size:11px;color:#ffffff60}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.approve{background:#a8ffd2;color:#09251a}.reject{background:#ffd0d0;color:#3a0909}.delete{background:#ffffff18;color:#fff}.notice{margin-top:12px;padding:12px;border-radius:14px;background:#ffffff0c;color:#fff;line-height:1.5}.logout{float:right;background:#ffffff10;color:#fff}.loginbox{max-width:460px;margin:35px auto}.error{color:#ffb4b4}.ok{color:#baffd4}
</style></head><body><main class="page"><div class="wrap"><header class="head"><div class="eyebrow">Aminah • Ammyace</div><h1>Wishes <span class="gold">Admin</span> 👑</h1><p class="muted">Private moderation dashboard for birthday wishes.</p></header>
<section id="login" class="panel loginbox"><h2>Admin sign in</h2><p class="muted">Enter the administrator email. Supabase will send a secure magic link.</p><input id="email" class="input" type="email" value="Edradia@gmail.com" autocomplete="email"><button id="loginBtn" type="button" class="btn primary">SEND MAGIC LINK</button><div id="loginNotice" class="notice hidden"></div></section>
<section id="app" class="hidden"><button id="logout" class="btn logout" type="button">Sign out</button><div id="status" class="notice hidden"></div><div class="tabs"><button type="button" class="btn tab active" data-status="pending">Pending</button><button type="button" class="btn tab" data-status="approved">Approved</button><button type="button" class="btn tab" data-status="rejected">Rejected</button></div><div id="grid" class="grid"></div></section>
</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://vrjxejuyiynllygiozhs.supabase.co';const SUPABASE_KEY='sb_publishable__esNlSYCC7dc4Cbn1yFZ4w_ttag7wqw';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let current='pending';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function note(text,good=false){$('status').textContent=text;$('status').className='notice '+(good?'ok':'');$('status').classList.remove('hidden')}
async function ensureAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data,error}=await sb.from('birthday_admins').select('email').ilike('email',user.email).limit(1);if(error||!data?.length){await sb.auth.signOut();note(error?'Admin check failed: '+error.message:'This account is not authorized for the birthday admin area.');return false}return true}
async function showApp(){if(await ensureAdmin()){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}}
async function sendMagicLink(){const email=$('email').value.trim();if(!email){$('loginNotice').textContent='Please enter the administrator email.';$('loginNotice').classList.remove('hidden');return}const btn=$('loginBtn');btn.disabled=true;$('loginNotice').textContent='Sending secure sign-in link…';$('loginNotice').className='notice';$('loginNotice').classList.remove('hidden');try{const response=await fetch(SUPABASE_URL+'/auth/v1/otp',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,create_user:true})});let result={};try{result=await response.json()}catch{}if(!response.ok){throw new Error(result.msg||result.message||result.error_description||('Supabase returned HTTP '+response.status))}$('loginNotice').textContent='Magic link sent. Check Edradia@gmail.com (including Spam/Junk).';$('loginNotice').className='notice ok'}catch(error){$('loginNotice').textContent='Could not send the magic link: '+error.message;$('loginNotice').className='notice error'}finally{btn.disabled=false}}
$('loginBtn').addEventListener('click',sendMagicLink);$('email').addEventListener('keydown',e=>{if(e.key==='Enter')sendMagicLink()});
sb.auth.onAuthStateChange((_event)=>showApp());$('logout').onclick=()=>sb.auth.signOut();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.status;load()});
async function load(){const {data,error}=await sb.from('birthday_wishes').select('id,name,message,image_path,created_at,status').eq('status',current).order('created_at',{ascending:false});if(error){$('grid').innerHTML='<div class="notice error">'+esc(error.message)+'</div>';return}if(!data?.length){$('grid').innerHTML='<div class="notice">No '+current+' wishes right now.</div>';return}$('grid').innerHTML=data.map(w=>`<article class="card">${w.image_path?`<img src="${SUPABASE_URL}/storage/v1/object/public/birthday-wishes/${encodeURIComponent(w.image_path)}" alt="Wish photo">`:''}<div class="body"><div class="name">${esc(w.name)}</div><div class="msg">${esc(w.message)}</div><div class="date">${new Date(w.created_at).toLocaleString()}</div><div class="actions">${current!=='approved'?`<button type="button" class="btn approve" onclick="setStatus('${w.id}','approved')">Approve</button>`:''}${current!=='rejected'?`<button type="button" class="btn reject" onclick="setStatus('${w.id}','rejected')">Reject</button>`:''}<button type="button" class="btn delete" onclick="removeWish('${w.id}')">Delete</button></div></div></article>`).join('')}
async function setStatus(id,status){const {error}=await sb.from('birthday_wishes').update({status}).eq('id',id);if(error)note(error.message);else{note('Wish updated.',true);load()}}async function removeWish(id){if(!confirm('Delete this wish permanently?'))return;const {error}=await sb.from('birthday_wishes').delete().eq('id',id);if(error)note(error.message);else{note('Wish deleted.',true);load()}}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)showApp()})();
</script></body></html>
