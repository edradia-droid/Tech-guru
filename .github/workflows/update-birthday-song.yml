name: Set Aminah Birthday Songs

on:
  push:
    paths:
      - '.github/workflows/update-birthday-song.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-songs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update birthday song controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_labels = [
              '<button class="music" id="song">🎵 Play Birthday Suit — The Weeknd (0:40–1:30)</button>',
              '<button class="music" id="song">🎵 Play a birthday melody</button>'
          ]
          new_first = '<button class="music" id="song">🎵 A BIRTHDAY SONG FOR YOU</button><button class="music" id="classicSong">🎂 HAPPY BIRTHDAY TO YOU</button>'
          for old in old_labels:
              if old in s:
                  s = s.replace(old, new_first, 1)
                  break

          marker = '</body>'
          script = r'''<script>
          (() => {
            const song = document.getElementById('song');
            const classic = document.getElementById('classicSong');
            if (!song || !classic) return;

            /* First song: YouTube playback, locked to 0:40–1:30. */
            const frame = document.createElement('iframe');
            frame.id = 'birthdaySongPlayer';
            frame.title = 'Birthday Suit by The Weeknd';
            frame.allow = 'autoplay; encrypted-media; picture-in-picture';
            frame.setAttribute('aria-hidden', 'true');
            frame.style.cssText = 'position:fixed;width:1px;height:1px;left:-10px;top:-10px;opacity:0;pointer-events:none;border:0;';
            frame.src = 'https://www.youtube.com/embed/h-Y-hKRXxAQ?enablejsapi=1&start=40&end=90&playsinline=1&origin=' + encodeURIComponent(location.origin);
            document.body.appendChild(frame);

            let playing = false;
            let timer = null;
            function command(func, args = []) {
              frame.contentWindow.postMessage(JSON.stringify({event:'command',func,args}), '*');
            }
            function resetModernSong() {
              playing = false;
              song.textContent = '🎵 A BIRTHDAY SONG FOR YOU';
              if (timer) clearInterval(timer);
            }
            song.addEventListener('click', () => {
              if (playing) {
                command('pauseVideo');
                resetModernSong();
                return;
              }
              command('seekTo', [40, true]);
              command('playVideo');
              playing = true;
              song.textContent = '⏸ Pause A BIRTHDAY SONG FOR YOU';
              if (timer) clearInterval(timer);
              timer = setInterval(() => command('getCurrentTime'), 500);
            });
            window.addEventListener('message', e => {
              if (e.source !== frame.contentWindow) return;
              try {
                const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                if (data.event === 'infoDelivery' && data.info && typeof data.info.currentTime === 'number' && data.info.currentTime >= 90) {
                  command('pauseVideo');
                  command('seekTo', [40, true]);
                  resetModernSong();
                }
              } catch (_) {}
            });

            /* Second song: a browser-synthesized Happy Birthday melody. */
            let audioCtx = null;
            let classicPlaying = false;
            let classicTimer = null;
            const melody = [
              ['G4',.28],['G4',.28],['A4',.55],['G4',.55],['C5',.55],['B4',1.0],
              ['G4',.28],['G4',.28],['A4',.55],['G4',.55],['D5',.55],['C5',1.0],
              ['G4',.28],['G4',.28],['G5',.55],['E5',.55],['C5',.55],['B4',.55],['A4',1.0],
              ['F5',.28],['F5',.28],['E5',.55],['C5',.55],['D5',.55],['C5',1.0]
            ];
            const freq = n => 440 * Math.pow(2, (parseInt(n.slice(1),10) + (n[0].charCodeAt(0)-65)*0 - 49) / 12) * Math.pow(2, ({C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2}[n[0]])/12);
            function noteFrequency(note) {
              const m = note.match(/^([A-G])([0-9])$/); if (!m) return 440;
              const semitone = {C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2}[m[1]] + (Number(m[2])-4)*12;
              return 440 * Math.pow(2, semitone/12);
            }
            function stopClassic() {
              classicPlaying = false;
              classic.textContent = '🎂 HAPPY BIRTHDAY TO YOU';
              if (classicTimer) clearTimeout(classicTimer);
            }
            function playClassic() {
              if (classicPlaying) { stopClassic(); return; }
              audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
              audioCtx.resume();
              classicPlaying = true;
              classic.textContent = '⏸ PAUSE HAPPY BIRTHDAY';
              let i = 0;
              const playNext = () => {
                if (!classicPlaying || i >= melody.length) { stopClassic(); return; }
                const [note, duration] = melody[i++];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = noteFrequency(note);
                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration - 0.03);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
                classicTimer = setTimeout(playNext, duration * 1000);
              };
              playNext();
            }
            classic.addEventListener('click', playClassic);
          })();
          </script>'''

          if 'id="classicSong"' not in s:
              s = s.replace(marker, script + '\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add second birthday song"
          git push
