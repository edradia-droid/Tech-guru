name: Deep yellow Aminah text

on:
  push:
    paths:
      - '.github/workflows/deep-yellow-aminah-text.yml'

permissions:
  contents: write

jobs:
  update-text-color:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Change paragraph text to deep yellow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '#ffe9bd': '#f5c400',
              '#fff0c9': '#f5c400',
              '#ffe8b5': '#f5c400',
              '#ffe7aa': '#f5c400',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit the color change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use deep yellow for Aminah page text'
          git push
