name: Switch birthday page paragraph text to deep blue

on:
  push:
    paths:
      - '.github/workflows/deep-blue-paragraphs.yml'

permissions:
  contents: write

jobs:
  update-text-color:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Change paragraph text to visible deep blue
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'color:#0b3d91': 'color:#1e88e5',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('The existing deep-blue paragraph color was not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit the actual index.html change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply visible deep blue to birthday page paragraphs'
          git push
